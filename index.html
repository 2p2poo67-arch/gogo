  #load { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 16px; box-sizing: border-box; text-align: center; overflow: hidden;
    color: #fff4d6; font: 400 20px "GogoCookie", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: radial-gradient(120% 80% at 50% 110%, #ffb8c9 0%, #b99be0 32%, #5b4f97 62%, #2b2a4c 100%);
    transition: opacity .6s ease; }
  #load.bye { opacity: 0; pointer-events: none; }
  #stars { position: absolute; inset: 0; pointer-events: none; }
  #stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff8e0; opacity: .3; animation: tw 2.6s ease-in-out infinite; }
  #stars i.b { width: 5px; height: 5px; box-shadow: 0 0 8px #fff4c2; }
  @keyframes tw { 50% { opacity: 1; transform: scale(1.5); } }
  .cloud { position: absolute; height: 18px; border-radius: 18px; background: #ffffff2e; pointer-events: none; animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .cloud::before { width: 26px; height: 26px; left: 12px; top: -13px; }
  .cloud::after { width: 18px; height: 18px; left: 34px; top: -8px; }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(calc(100vw + 120px)); } }

  #scene { position: relative; width: min(78vw, 46vh, 380px); aspect-ratio: 1 / 1; }
  #scene svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .spin { transform-box: view-box; transform-origin: 150px 165px; animation: spin 22s linear infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }
  .rex { animation: hop .42s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .legA, .legB { transform-box: fill-box; transform-origin: 50% 0%; animation: step .42s ease-in-out infinite; }
  .legB { animation-delay: -.21s; }
  @keyframes step { 0%, 100% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } }
  .tail { transform-box: fill-box; transform-origin: 100% 40%; animation: wag .84s ease-in-out infinite; }
  @keyframes wag { 50% { transform: rotate(-9deg); } }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 3.8s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .flap { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .5s ease-in-out infinite; }
  .flap.r { transform-origin: 50% 100%; animation-delay: -.25s; }
  @keyframes flap { 50% { transform: scaleY(-.35); } }
  .pf { animation: pf .44s infinite; } .pf2 { animation-delay: -.22s; }
  @keyframes pf { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .glint { animation: glint 2.4s ease-in-out infinite; }
  @keyframes glint { 50% { opacity: .15; } }
  .puff { transform-box: fill-box; transform-origin: 50% 100%; animation: puff 3s ease-out infinite; }
  @keyframes puff { 0% { transform: translateY(0) scale(.5); opacity: 0; } 25% { opacity: .9; } 100% { transform: translateY(-14px) scale(1.3); opacity: 0; } }
  .halo { animation: halo 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes halo { 50% { transform: scale(1.04); opacity: .75; } }

  #msg { position: relative; text-shadow: 0 2px 0 #3d2f6b; letter-spacing: .5px; }
  #msg .d { display: inline-block; animation: dot 1.2s ease-in-out infinite; }
  #msg .d:nth-child(2) { animation-delay: .15s; } #msg .d:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  #bar { width: min(70vw, 360px); height: 14px; border-radius: 7px; background: #ffffff33; overflow: hidden; margin-top: 4px; }
  #fill { width: 0; height: 100%; background: #ffd66b; transition: width .2s; }
  #tip { position: relative; max-width: min(86vw, 420px); min-height: 2.6em; margin-top: 6px; padding: 9px 16px; box-sizing: border-box;
    border-radius: 18px; background: #fff4d6; color: #6b4a2e; font-size: 14px; line-height: 1.35;
    box-shadow: 0 4px 0 #3d2f6b66; transition: opacity .35s; word-break: keep-all; }
  #tip::before { content: ""; position: absolute; top: -8px; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: #fff4d6; }
  #tip.fade { opacity: 0; }
  @media (max-height: 520px) { #tip { display: none; } #load { gap: 6px; } }
  @media (prefers-reduced-motion: reduce) { #load *, #load *::before, #load *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; } }
</style>

<script>
  // 저장 데이터를 브라우저가 임의로 지우지 않게 요청 (폰에서 저장 유지)
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});

  // 이름 입력창(#gogo-ask)이 떠 있을 땐 게임보다 먼저 키를 받아서, 게임이 글자를 가로채지 않게 함
  // (게임보다 먼저 등록해야 해서 로더보다 앞에 둠. 글자 입력 자체는 브라우저 기본 동작이라 그대로 됨)
  ["keydown", "keypress", "keyup", "touchstart", "touchend", "mousedown", "mouseup", "pointerdown", "pointerup"].forEach(function (type) {
    window.addEventListener(type, function (e) {
      var t = e.target;
      if (!t || !t.closest || !t.closest("#gogo-ask")) return;
      e.stopImmediatePropagation();
      if (type !== "keydown") return;
      if (e.key === "Enter") { if (e.isComposing || e.keyCode === 229) { if (window.gogoAskEnterAfterIme) window.gogoAskEnterAfterIme(); } else if (window.gogoAskSubmit) window.gogoAskSubmit(); }
      else if (e.key === "Escape" && window.gogoAskCancel) window.gogoAskCancel();
    }, true);
  });

  // 아이폰 사파리: 효과음 하나를 못 풀면(EncodingError: Decoding failed) 유니티가 경고창을 띄워 게임을 막음
  // → 그 오류만 조용히 넘김 (소리 하나만 안 나고 게임은 그대로). 로더보다 먼저 등록해야 유니티 경고창보다 앞섬
  function gogoQuietAudioError(e) {
    var r = e && (e.reason || e.error || e.message);
    var s = String(r && (r.name || "") + " " + (r.message || r) || "");
    // 아이폰 사파리: 저장소(IndexedDB) 동기화가 한 번 실패하면 'dst.entries' 오류 경고창 → 그 한 번만 건너뜀 (다음 저장 때 다시 씀)
    if (!/EncodingError|Decoding failed|decodeAudioData|dst\.entries|reconcile/i.test(s)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (window.console) console.warn("[GOGO] 소리 하나 / 저장 동기화 한 번을 건너뜀:", s);
  }
  window.addEventListener("unhandledrejection", gogoQuietAudioError, true);
  window.addEventListener("error", gogoQuietAudioError, true);

  var canvas = document.getElementById("game");
  var isPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)) || (navigator.maxTouchPoints > 0 && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches);   /* FITPHONES 폴드·태블릿 */   // 아이패드는 맥처럼 보여서 터치로 확인
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // 폰: 첫 터치에 전체화면 시도 (세로 기본, 가로도 됨. 안 되는 브라우저는 그냥 넘어감)
  if (isPhone) {
    document.addEventListener("touchend", function once() {
      document.removeEventListener("touchend", once);
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    }, { passive: true });
  }

  // ───── 로딩 화면 연출 (게임과 무관, 로딩이 끝나면 멈춤) ─────
  var gogoLoad = (function () {
    var box = document.getElementById("load"), stars = document.getElementById("stars");
    for (var i = 0; i < 46; i++) {
      var s = document.createElement("i");
      if (i % 6 === 0) s.className = "b";
      s.style.left = (Math.random() * 100) + "%"; s.style.top = (Math.random() * 70) + "%";
      s.style.animationDelay = (-Math.random() * 2.6) + "s"; s.style.animationDuration = (1.8 + Math.random() * 2) + "s";
      stars.appendChild(s);
    }
    var tips = [
      "공룡들은 너를 친구 사우르스라고 생각해~티라노!",
      "알은 둥지에 놓아야 깨어나~티라노!",
      "나무를 연달아 흔들면 콤보 보너스가 나와~티라노!",
      "밤바다는 반짝반짝 빛나~ 꼭 구경해 봐~티라노!",
      "단짝 공룡은 땅속 보물을 킁킁 찾아줘~티라노!",
      "공룡이랑 친해지면 하트가 쑥쑥 올라~티라노!",
      "멀리 있는 하늘섬에도 친구 공룡이 살아~티라노!"
    ];
    if (!isPhone) tips.push("Q / E 키로 섬을 빙글 돌려 볼 수 있어~티라노!");
    var tip = document.getElementById("tip"), ti = Math.floor(Math.random() * tips.length);
    tip.textContent = tips[ti];
    var tipTimer = setInterval(function () {
      tip.className = "fade";
      setTimeout(function () { ti = (ti + 1) % tips.length; tip.textContent = tips[ti]; tip.className = ""; }, 350);
    }, 4200);

    // 익룡: 기울어진 타원 궤도, 위쪽 반은 행성 뒤로 숨음
    var ptero = document.getElementById("ptero"), body = document.getElementById("pteroBody");
    var behind = document.getElementById("behind"), front = document.getElementById("front"), raf = 0, t0 = performance.now();
    function fly(now) {
      var a = (now - t0) / 1000 * 0.75, x = 150 + Math.cos(a) * 128, y = 158 + Math.sin(a) * 34 - Math.cos(a) * 18;
      var inFront = Math.sin(a) > 0, sc = 1.15 + Math.sin(a) * 0.3, dir = -Math.sin(a) >= 0 ? 1 : -1;
      if (inFront && ptero.parentNode !== front) front.appendChild(ptero);
      if (!inFront && ptero.parentNode !== behind) behind.appendChild(ptero);
      ptero.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") scale(" + (sc * dir).toFixed(3) + " " + sc.toFixed(3) + ")");
      raf = requestAnimationFrame(fly);
    }
    raf = requestAnimationFrame(fly);

    var fill = document.getElementById("fill"), msg = document.getElementById("msg");
    var landed = false;
    return {
      progress: function (p) {
        var v = Math.max(0, Math.min(1, p)), w = Math.round(v * 100);
        fill.style.width = w + "%";
        if (v >= 0.9 && !landed) { landed = true; msg.firstChild.nodeValue = "공룡섬에 착륙하는 중"; }
      },
      done: function () {
        box.className = "bye";
        setTimeout(function () { box.style.display = "none"; cancelAnimationFrame(raf); clearInterval(tipTimer); }, 650);
      },
      fail: function (text) { cancelAnimationFrame(raf); clearInterval(tipTimer); msg.textContent = text; }
    };
  })();

  var buildUrl = "Build";
  // 빌드마다 바뀌는 번호 (WebBuild.cs 가 채움): 업데이트 직후 옛 파일과 새 파일이 섞여 받아지지 않게
  var gogoV = "?v=202611040340";
  var config = {
    dataUrl: buildUrl + "/Web.data.unityweb" + gogoV,
    frameworkUrl: buildUrl + "/Web.framework.js.unityweb" + gogoV,
    codeUrl: buildUrl + "/Web.wasm.unityweb" + gogoV,
    streamingAssetsUrl: "StreamingAssets",
    autoSyncPersistentDataPath: true,   // 저장 파일은 바뀔 때 유니티가 알아서 IndexedDB 로 (아이폰 'dst.entries' 동기화 오류 줄이기)
    companyName: "DefaultCompany",
    productName: "GOGO",
    productVersion: "0.1.0",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: isPhone ? Math.max(1, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(1800000 / Math.max(1, innerWidth * innerHeight)))) : (/[?&]hd=1/.test(location.search) ? (window.devicePixelRatio || 1) : Math.max(1, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3686400 / Math.max(1, innerWidth * innerHeight))))),   // 폰 발열 줄이기 (폰은 배율 2, 태블릿은 약 180만 픽셀까지) · PC는 배율 2·약 370만 픽셀까지 (노트북 발열, ?hd=1 이면 원래대로)
  };

  var script = document.createElement("script");
  script.src = buildUrl + "/Web.loader.js" + gogoV;
  // 폰은 PC용 텍스처(DXT)를 못 읽어서 풀어서 올림 → 메모리·발열. 폰용 ASTC 데이터가 있으면 그걸 받음 (GOGO → 웹 빌드 (폰 텍스처 포함))
  var astcUrl = config.dataUrl.replace(/\.data/, ".astc.data");
  function phoneAstc() {
    try {
      var c = document.createElement("canvas"), gl = c.getContext("webgl2") || c.getContext("webgl");
      var ok = !!(gl && gl.getExtension("WEBGL_compressed_texture_astc"));
      var lose = gl && gl.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext();
      return ok;
    } catch (e) { return false; }
  }
  script.onload = function () {
    if (isPhone && phoneAstc()) {
      fetch(astcUrl, { method: "HEAD", cache: "no-store" }).then(function (r) { if (r.ok) config.dataUrl = astcUrl; }).catch(function () {}).then(boot);
    } else boot();
  };
  function boot() {
    createUnityInstance(canvas, config, function (p) {
      gogoLoad.progress(p);
    }).then(function (instance) {
      window.gogoInstance = instance;
      gogoLoad.progress(1);
      gogoLoad.done();
    }).catch(function (e) {
      gogoLoad.fail("게임을 불러오지 못했어요: " + e);
    });
  };
  document.body.appendChild(script);
</script>
</body>
