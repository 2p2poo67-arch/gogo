  /* ───── 로딩 화면: 공룡섬 행성이 빙글빙글 ───── */
  #load { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 16px; box-sizing: border-box; text-align: center; overflow: hidden;
    color: #fff4d6; font: 400 20px "GogoCookie", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: radial-gradient(120% 80% at 50% 110%, #ffb8c9 0%, #b99be0 32%, #5b4f97 62%, #2b2a4c 100%);
    transition: opacity .6s ease; }
  #load.bye { opacity: 0; pointer-events: none; }
  #stars { position: absolute; inset: 0; pointer-events: none; }
  #stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff8e0; opacity: .3; animation: tw 2.6s ease-in-out infinite; }
  #stars i.b { width: 5px; height: 5px; box-shadow: 0 0 8px #fff4c2; }
  @keyframes tw { 50% { opacity: 1; transform: scale(1.5); } }
  .cloud { position: absolute; height: 18px; border-radius: 18px; background: #ffffff2e; pointer-events: none; animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .cloud::before { width: 26px; height: 26px; left: 12px; top: -13px; }
  .cloud::after { width: 18px; height: 18px; left: 34px; top: -8px; }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(calc(100vw + 120px)); } }

  #scene { position: relative; width: min(78vw, 46vh, 380px); aspect-ratio: 1 / 1; }
  #scene svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .spin { transform-box: view-box; transform-origin: 150px 165px; animation: spin 22s linear infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }
  .rex { animation: hop .42s ease-in-out infinite; }
  .rf { animation: pf .42s infinite; } .rf2 { animation-delay: -.21s; }   /* LOADREX 걸음 2프레임 */
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .legA, .legB { transform-box: fill-box; transform-origin: 50% 0%; animation: step .42s ease-in-out infinite; }
  .legB { animation-delay: -.21s; }
  @keyframes step { 0%, 100% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } }
  .tail { transform-box: fill-box; transform-origin: 100% 40%; animation: wag .84s ease-in-out infinite; }
  @keyframes wag { 50% { transform: rotate(-9deg); } }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 3.8s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .flap { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .5s ease-in-out infinite; }
  .flap.r { transform-origin: 50% 100%; animation-delay: -.25s; }
  @keyframes flap { 50% { transform: scaleY(-.35); } }
  .pf { animation: pf .44s infinite; } .pf2 { animation-delay: -.22s; }
  @keyframes pf { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .glint { animation: glint 2.4s ease-in-out infinite; }
  @keyframes glint { 50% { opacity: .15; } }
  .puff { transform-box: fill-box; transform-origin: 50% 100%; animation: puff 3s ease-out infinite; }
  @keyframes puff { 0% { transform: translateY(0) scale(.5); opacity: 0; } 25% { opacity: .9; } 100% { transform: translateY(-14px) scale(1.3); opacity: 0; } }
  .halo { animation: halo 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes halo { 50% { transform: scale(1.04); opacity: .75; } }

  #msg { position: relative; text-shadow: 0 2px 0 #3d2f6b; letter-spacing: .5px; }
  #msg .d { display: inline-block; animation: dot 1.2s ease-in-out infinite; }
  #msg .d:nth-child(2) { animation-delay: .15s; } #msg .d:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  #bar { width: min(70vw, 360px); height: 14px; border-radius: 7px; background: #ffffff33; overflow: hidden; margin-top: 4px; }
  #fill { width: 0; height: 100%; background: #ffd66b; transition: width .2s; }
  #tip { position: relative; max-width: min(86vw, 420px); min-height: 2.6em; margin-top: 6px; padding: 9px 16px; box-sizing: border-box;
    border-radius: 18px; background: #fff4d6; color: #6b4a2e; font-size: 14px; line-height: 1.35;
    box-shadow: 0 4px 0 #3d2f6b66; transition: opacity .35s; word-break: keep-all; }
  #tip::before { content: ""; position: absolute; top: -8px; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: #fff4d6; }
  #tip.fade { opacity: 0; }
  @media (max-height: 520px) { #tip { display: none; } #load { gap: 6px; } }
  @media (prefers-reduced-motion: reduce) { #load *, #load *::before, #load *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; } }
  /* INAPPOUT 앱 안 브라우저 카드 (로딩 화면 위) */
  #inapp { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    background: #2b2a4ccc; font: 400 18px "GogoCookie", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; touch-action: manipulation; }
  #inapp .ia-card { width: min(100%, 360px); padding: 22px 18px 16px; box-sizing: border-box; border-radius: 24px; background: #fff4d6; color: #6b4a2e;
    text-align: center; box-shadow: 0 6px 0 #3d2f6b88; word-break: keep-all; }
  #inapp .ia-egg { font-size: 40px; line-height: 1; margin-bottom: 8px; }
  #inapp .ia-t { font-size: 21px; line-height: 1.3; color: #5a3b22; }
  #inapp .ia-b { font-size: 15px; line-height: 1.4; margin-top: 8px; }
  #inapp .ia-step { font-size: 15px; line-height: 1.45; margin-top: 12px; padding: 10px; border-radius: 14px; background: #ffe7b0; }
  #inapp button { display: block; width: 100%; min-height: 52px; margin-top: 12px; border: 0; border-radius: 16px; font: inherit; cursor: pointer; }
  #inapp .ia-go { background: #ffd66b; color: #5a3b22; font-size: 19px; box-shadow: 0 4px 0 #d9a93a; }
  #inapp .ia-go:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9a93a; }
  #inapp .ia-stay { min-height: 44px; background: transparent; color: #9a7a5c; font-size: 15px; text-decoration: underline; }
  #inapp .ia-url { display: none; margin-top: 8px; padding: 8px; border-radius: 10px; background: #fff; font: 13px system-ui, sans-serif; color: #444;
    word-break: break-all; -webkit-user-select: all; user-select: all; }
  #copy { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 11px; letter-spacing: .02em; color: rgba(255,255,255,.72); pointer-events: none; }   /* SECURE 저작권 */

          autoResubscribe: true
        });
        // 게임을 보고 있을 땐 알림을 띄우지 않음 (이미 화면에 보이니까)
        OneSignal.Notifications.addEventListener("foregroundWillDisplay", function (e) {
          if (document.visibilityState === "visible") { try { e.preventDefault(); } catch (x) {} }
        });
        P.ready = true;
        if (P.wantOn) { try { await OneSignal.User.PushSubscription.optIn(); } catch (x) {} }
        if (P.pid) { try { await OneSignal.login(P.pid); } catch (x) {} }
      } catch (e) { P.err = String(e && e.message || e); }
    });
  };
  P.login = function (pid) {
    if (!pid || pid === P.pid) return;
    P.pid = pid;
    if (P.ready) { try { OneSignal.login(pid); } catch (e) {} }
  };
  P.set = function (on) {
    if (!P.ready) { P.wantOn = !!on; if (on) P.load(); return; }
    try { if (on) OneSignal.User.PushSubscription.optIn(); else OneSignal.User.PushSubscription.optOut(); } catch (e) {}
  };
  window.addEventListener("load", function () {
    if (P.can() && Notification.permission === "granted") setTimeout(P.load, 12000);
  });

  // ── 티라 말투 동의 창 (진짜 손가락 누름이어야 사파리가 허락 창을 띄워 줘서 HTML 로 그림) ──
  function ui(title, lines, buttons) {
    var old = document.getElementById("gogo-push"); if (old) old.remove();
    var wrap = document.createElement("div");
    wrap.id = "gogo-push";
    wrap.style.cssText = "position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(43,42,76,.45);font-family:system-ui,sans-serif";
    var box = document.createElement("div");
    box.style.cssText = "background:#fff8e6;border-radius:20px;padding:18px 20px 16px;width:min(88vw,420px);box-shadow:0 8px 30px rgba(0,0,0,.25);color:#40301f;border:3px solid #ffd9a8";
    var tag = document.createElement("div");
    tag.textContent = title;
    tag.style.cssText = "display:inline-block;background:#ffd98a;border-radius:12px;padding:4px 12px;font-weight:800;font-size:15px;margin-bottom:10px";
    box.appendChild(tag);
    lines.forEach(function (t, i) {
      var p = document.createElement("div");
      p.textContent = t;
      p.style.cssText = i === 0 ? "font-size:17px;font-weight:700;line-height:1.45;margin-bottom:8px" : "font-size:14px;line-height:1.5;opacity:.8;margin-top:3px";
      box.appendChild(p);
    });
    var row = document.createElement("div");
    row.style.cssText = "display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap";
    function close() { wrap.remove(); var c = document.querySelector("canvas"); if (c) c.focus(); }
    buttons.forEach(function (b) {
      var el = document.createElement("button");
      el.textContent = b[0];
      el.style.cssText = "font-size:16px;font-weight:800;padding:11px 18px;min-height:46px;border:0;border-radius:14px;cursor:pointer;color:#40301f;background:" + b[1];
      el.onclick = function () { close(); b[2](); };
      row.appendChild(el);
    });
    box.appendChild(row); wrap.appendChild(box); document.body.appendChild(wrap);
  }
  function send(go, v) { try { window.gogoInstance.SendMessage(go, "OnPushAnswer", v); } catch (e) {} }
  var PINK = "#ffc8d6", CREAM = "#efe6d2", SUN = "#ffd98a";

  // mode: default(알림 허락 묻기) · ios-browser(홈 화면 추가 안내) · ios-app(홈 화면 앱 첫 실행: 사파리 섬 불러오기 안내)
  P.ask = function (go, mode, id) {
    if (mode === "ios-browser") {
      var l = ["아이폰은 고고 다이노를 홈 화면에 추가하면 티라가 알림을 보낼 수 있어!",
               "1. 사파리 아래쪽 공유 버튼 (네모에 화살표)을 눌러",
               "2. 「홈 화면에 추가」를 누르고 「추가」",
               "3. 홈 화면에 생긴 고고 다이노로 들어와!"];
      if (id) l.push("홈 화면 앱은 사파리랑 저장이 따로라서, 들어가면 설정 → 클라우드에서 아이디 「" + id + "」로 로그인해 줘. 지금 섬 그대로 나와!");
      else l.push("홈 화면 앱은 사파리랑 저장이 따로라서, 먼저 아이디를 만들어 두면 섬을 그대로 가져갈 수 있어.");
      var b = [["알겠어", SUN, function () { send(go, "later"); }]];
      if (!id) b.unshift(["아이디 만들기", PINK, function () { send(go, "openid"); }]);
      ui("티라의 알림", l, b);
      return;
    }
    if (mode === "ios-app") {
      ui("어서 와!", ["사파리에서 키우던 섬이 있어?",
                      "있으면 아이디로 로그인해서 그 섬을 불러와. 지금 이 섬은 따로 백업해 둘게."],
         [["새로 할래", CREAM, function () { send(go, "later"); }], ["로그인하기", PINK, function () { send(go, "openid"); }]]);
      return;
    }
    ui("티라의 알림", ["알이 톡 깨어나거나 섬 공사가 끝나면 티라가 알려줄까?",
                      "밤 9시부터 아침 8시까지는 조용히 있을게.",
                      "이름 · 전화번호 · 이메일은 안 받아. 설정에서 언제든 끌 수 있어."],
       [["괜찮아", CREAM, function () { send(go, "later"); }],
        ["알려줘!", PINK, function () {
          // 이 누름 안에서 바로 브라우저 허락 창을 띄움 (사파리 규칙)
          try {
            var r = Notification.requestPermission(function (v) { done(v); });
            if (r && r.then) r.then(done, function () { done("default"); });
          } catch (e) { done("default"); }
          var fired = false;
          function done(v) { if (fired) return; fired = true; if (v === "granted") { P.load(); P.set(true); } send(go, v || "default"); }
        }]]);
  };
})();
</script>

<script>
  // 저장 데이터를 브라우저가 임의로 지우지 않게 요청 (폰에서 저장 유지)
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});

  // 이름 입력창(#gogo-ask)이 떠 있을 땐 게임보다 먼저 키를 받아서, 게임이 글자를 가로채지 않게 함
  // (게임보다 먼저 등록해야 해서 로더보다 앞에 둠. 글자 입력 자체는 브라우저 기본 동작이라 그대로 됨)
  ["keydown", "keypress", "keyup", "touchstart", "touchend", "mousedown", "mouseup", "pointerdown", "pointerup"].forEach(function (type) {
    window.addEventListener(type, function (e) {
      var t = e.target;
      if (!t || !t.closest || !t.closest("#gogo-ask")) return;
      e.stopImmediatePropagation();
      if (type !== "keydown") return;
      if (e.key === "Enter") { if (e.isComposing || e.keyCode === 229) { if (window.gogoAskEnterAfterIme) window.gogoAskEnterAfterIme(); } else if (window.gogoAskSubmit) window.gogoAskSubmit(); }
      else if (e.key === "Escape" && window.gogoAskCancel) window.gogoAskCancel();
    }, true);
  });

  // 아이폰 사파리: 효과음 하나를 못 풀면(EncodingError: Decoding failed) 유니티가 경고창을 띄워 게임을 막음
  // → 그 오류만 조용히 넘김 (소리 하나만 안 나고 게임은 그대로). 로더보다 먼저 등록해야 유니티 경고창보다 앞섬
  function gogoQuietAudioError(e) {
    var r = e && (e.reason || e.error || e.message);
    var s = String(r && (r.name || "") + " " + (r.message || r) || "");
    // 아이폰 사파리: 저장소(IndexedDB) 동기화가 한 번 실패하면 'dst.entries' 오류 경고창 → 그 한 번만 건너뜀 (다음 저장 때 다시 씀)
    if (!/EncodingError|Decoding failed|decodeAudioData|dst\.entries|reconcile/i.test(s)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (window.console) console.warn("[GOGO] 소리 하나 / 저장 동기화 한 번을 건너뜀:", s);
  }
  window.addEventListener("unhandledrejection", gogoQuietAudioError, true);
  window.addEventListener("error", gogoQuietAudioError, true);

  /* PHONEPERF 11-10: 유니티 한 장 계산 시간 재기 (화면 그리기 콜백이 걸린 ms, 3초 평균). 게임 안 gogo_stat cpuMs 로 감. 값만 잼, 동작은 그대로 */
  (function () {
    var W = window, P = W.performance; if (!P || !P.now || W.gogoCpu) return;
    var M = W.gogoCpu = { ms: 0, fps: 0, a: 0, n: 0, t0: P.now() };
    function wrap(fn) { return function () { var t = P.now(); try { return fn.apply(this, arguments); } finally { var e = P.now(), d = e - t; if (d >= 1) { M.a += d; M.n++; } if (e - M.t0 >= 3000) { if (M.n) { M.ms = Math.round(M.a / M.n * 10) / 10; M.fps = Math.round(M.n / ((e - M.t0) / 1000) * 10) / 10; } M.a = 0; M.n = 0; M.t0 = e; } } }; }
    var raf = W.requestAnimationFrame; if (raf) W.requestAnimationFrame = function (cb) { return raf.call(W, typeof cb === "function" ? wrap(cb) : cb); };
    var st = W.setTimeout; W.setTimeout = function (cb) { var a = Array.prototype.slice.call(arguments); if (typeof cb === "function") a[0] = wrap(cb); return st.apply(W, a); };
  })();
  var canvas = document.getElementById("game");
  var isPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)) || (navigator.maxTouchPoints > 0 && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches);   /* FITPHONES 폴드·태블릿 */   // 아이패드는 맥처럼 보여서 터치로 확인
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // 폰: 첫 터치에 전체화면 시도 (세로 기본, 가로도 됨. 안 되는 브라우저는 그냥 넘어감)
  if (isPhone) {
    document.addEventListener("touchend", function once() {
      document.removeEventListener("touchend", once);
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    }, { passive: true });
  }

  // ───── 로딩 화면 연출 (게임과 무관, 로딩이 끝나면 멈춤) ─────
  var gogoLoad = (function () {
    var box = document.getElementById("load"), stars = document.getElementById("stars");
    for (var i = 0; i < 46; i++) {
      var s = document.createElement("i");
      if (i % 6 === 0) s.className = "b";
      s.style.left = (Math.random() * 100) + "%"; s.style.top = (Math.random() * 70) + "%";
      s.style.animationDelay = (-Math.random() * 2.6) + "s"; s.style.animationDuration = (1.8 + Math.random() * 2) + "s";
      stars.appendChild(s);
    }
    var tips = [
      "공룡들은 너를 친구 사우르스라고 생각해~티라노!",
      "알은 둥지에 놓아야 깨어나~티라노!",
      "나무를 연달아 흔들면 콤보 보너스가 나와~티라노!",
      "밤바다는 반짝반짝 빛나~ 꼭 구경해 봐~티라노!",
      "단짝 공룡은 땅속 보물을 킁킁 찾아줘~티라노!",
      "공룡이랑 친해지면 하트가 쑥쑥 올라~티라노!",
      "멀리 있는 하늘섬에도 친구 공룡이 살아~티라노!"
    ];
    if (!isPhone) tips.push("Q / E 키로 섬을 빙글 돌려 볼 수 있어~티라노!");
    var tip = document.getElementById("tip"), ti = Math.floor(Math.random() * tips.length);
    tip.textContent = tips[ti];
    var tipTimer = setInterval(function () {
      tip.className = "fade";
      setTimeout(function () { ti = (ti + 1) % tips.length; tip.textContent = tips[ti]; tip.className = ""; }, 350);
    }, 4200);

    var raf = 0;   // LOADNODINO 익룡 궤도 없음

    var fill = document.getElementById("fill"), msg = document.getElementById("msg");
    var landed = false;
    return {
      progress: function (p) {
        var v = Math.max(0, Math.min(1, p)), w = Math.round(v * 100);
        fill.style.width = w + "%";
        if (v >= 0.9 && !landed) { landed = true; msg.firstChild.nodeValue = "공룡섬에 착륙하는 중"; }
      },
      done: function () {
        box.className = "bye";
        setTimeout(function () { box.style.display = "none"; cancelAnimationFrame(raf); clearInterval(tipTimer); }, 650);
      },
      fail: function (text) { cancelAnimationFrame(raf); clearInterval(tipTimer); msg.textContent = text; }
    };
  })();

  var buildUrl = "Build";
  // 빌드마다 바뀌는 번호 (WebBuild.cs 가 채움): 업데이트 직후 옛 파일과 새 파일이 섞여 받아지지 않게
  var gogoV = "?v=202611101056";
  var config = {
    dataUrl: buildUrl + "/Web.data.unityweb" + gogoV,
    frameworkUrl: buildUrl + "/Web.framework.js.unityweb" + gogoV,
    codeUrl: buildUrl + "/Web.wasm.unityweb" + gogoV,
    streamingAssetsUrl: "StreamingAssets",
    autoSyncPersistentDataPath: true,   // 저장 파일은 바뀔 때 유니티가 알아서 IndexedDB 로 (아이폰 'dst.entries' 동기화 오류 줄이기)
    companyName: "DefaultCompany",
    productName: "GOGO",
    productVersion: "0.1.0",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: isPhone ? (function () { /* SHARPUI 11-06: 캔버스는 기기 배율 그대로(최대 3 · 320만 픽셀), 3D 무게는 GogoSharpK 로 예전과 같게 */ var d = window.devicePixelRatio || 1, a = Math.max(1, innerWidth * innerHeight); var o = Math.max(1, Math.min(d, 2, Math.sqrt(1800000 / a))); if (/[?&]dpr2=1/.test(location.search)) { window.gogoSharpK = 1; return o; } var n = Math.max(o, Math.min(d, 3, Math.sqrt(3200000 / a))); window.gogoSharpK = o / n; return n; })() : (/[?&]hd=1/.test(location.search) ? (window.devicePixelRatio || 1) : Math.max(1, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3686400 / Math.max(1, innerWidth * innerHeight))))),   // 폰 발열 줄이기 (폰은 배율 2, 태블릿은 약 180만 픽셀까지) · PC는 배율 2·약 370만 픽셀까지 (노트북 발열, ?hd=1 이면 원래대로)
  };

  // ───── INAPPOUT 11-06 인스타 · 카톡 · 페북 같은 앱 안 브라우저 → 크롬 · 사파리로 열어 달라고 (받기 전에) ─────
  // 앱 안 브라우저는 메모리가 작아서 88MB 게임을 받다가 · 켜다가 자주 멈춤 (11-04 인스타 멈춤). 처음 오는 사람만 물어봄:
  //  섬 사본(gogo.snap.*)이 이미 있는 사람은 그 브라우저에 섬이 있으니까 절대 안 내보냄. "그냥 여기서 할래요" 고르면 다시 안 물어봄.
  //  ?inapp=1 시험으로 띄우기 · ?inapp=0 안 띄우기
  // 받기 기록 (gogo.load): 어느 앱 · 무엇을 골랐나 · 받기 시작 수 / 다 받은 수 / 실패 수 · 걸린 초 → 게임 안 플레이 기록(gogo_stat)이 읽어 감
  var gogoT0 = Date.now(), gogoApp = "", gogoPick = "";
  // QATAG ?qa=1 로 연 브라우저는 시험 접속으로 표시 (플레이 기록에서 뺌), ?qa=0 이면 풂
  if (/[?&]qa=1/.test(location.search)) gogoLS("gogo.qa", "1"); else if (/[?&]qa=0/.test(location.search)) gogoLS("gogo.qa", "0");
  function gogoLS(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

  // ───── CRASHMARK 11-06 튕김 기록: 화면이 보이는 채로 게임이 꺼졌나(꺼짐) · 유니티만 멈췄나(멈춤) ─────
  //  창을 숨기거나 닫으면 '깨끗하게 나감' 표시. 다음에 켤 때 표시가 없으면 = 보이는 채로 죽음 → gogo.die 에 한 줄.
  //  유니티(IslandLifeStat)는 2초마다 gogo.liveu = "시각|화면" 을 적음. 그게 15초 넘게 안 오면 = 멈춤.
  //  화면 · 저장 안 건드림. gogo_stat(die)이 읽어 감.
  var gogoLive = (function () {
    var K = "gogo.live", t0 = Date.now(), L = { t: t0, s: 0, st: "get", c: 0, fz: 0, vs: t0, v: gogoV.replace("?v=", ""), e: "" };
    function kst(ms) { var d = new Date(ms + 9 * 3600000); function p(n) { return (n < 10 ? "0" : "") + n; } return p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()); }
    function uT(U) { return +((U || "").split("|")[0]) || 0; }
    function stale(P, U, now) { var ut = uT(U); return P.st === "game" && ut > 0 && now - Math.max(ut, P.vs || 0) > 15000; }
    function note(kind, P, U) {
      try {
        var at = (U || "").split("|")[1] || "";
        var e = kind + "@" + P.st + (at ? "/" + at : "") + " " + Math.round(P.s) + "s [v" + P.v + " " + kst(P.t) + " KST]" + (P.e ? " " + P.e : "");
        var a = []; try { a = JSON.parse(gogoLS("gogo.die") || "[]") || []; } catch (x) { a = []; }
        a.push(e.slice(0, 140)); while (a.length > 6) a.shift();
        gogoLS("gogo.die", JSON.stringify(a));
      } catch (x) {}
    }
    try {
      var P = JSON.parse(gogoLS(K) || "null"), U0 = gogoLS("gogo.liveu") || "";
      if (P && !P.c && !P.fz) note(stale(P, U0, P.t) ? "멈춤" : "꺼짐", P, U0);
    } catch (x) {}
    gogoLS("gogo.liveu", "");
    function save() {
      L.t = Date.now(); L.s = (L.t - t0) / 1000;
      if (!L.c && !L.fz) { var U = gogoLS("gogo.liveu") || ""; if (stale(L, U, L.t)) { L.fz = 1; note("멈춤", L, U); } }
      gogoLS(K, JSON.stringify(L));
    }
    function hide() { if (!L.c) { L.c = 1; save(); } }
    function show() { L.c = 0; L.vs = Date.now(); save(); }
    document.addEventListener("visibilitychange", function () { if (document.hidden) hide(); else show(); });
    window.addEventListener("pagehide", hide);
    window.addEventListener("pageshow", function (ev) { if (ev.persisted) show(); });
    window.addEventListener("error", function (ev) { try { L.e = String(ev.message || "").slice(0, 50); } catch (x) {} });
    setInterval(save, 2000); save();
    return { st: function (s) { if (L.st !== s) { L.st = s; save(); } } };
  })();
  function gogoLoadNote(extra) {
    try {
      var o = { app: gogoApp, pick: gogoPick, ph: isPhone ? 1 : 0, v: gogoV.replace("?v=", ""), tr: +(gogoLS("gogo.loadtry") || 0), ok: +(gogoLS("gogo.loadok") || 0), fail: +(gogoLS("gogo.loadfail") || 0) };
      for (var k in extra) o[k] = extra[k];
      gogoLS("gogo.load", JSON.stringify(o));
    } catch (e) {}
  }
  function gogoInApp(go) {
    function start() {
      gogoLS("gogo.loadtry", String(+(gogoLS("gogo.loadtry") || 0) + 1));
      gogoT0 = Date.now();
      go();
    }
    var ua = navigator.userAgent || "", q = location.search, test = /[?&]inapp=1/.test(q);
    var app = /Instagram/i.test(ua) ? "인스타그램" : /KAKAOTALK/i.test(ua) ? "카카오톡" : /FBAN|FBAV|FB_IAB/i.test(ua) ? "페이스북" : /NAVER\(inapp|NAVER\//i.test(ua) ? "네이버"
            : /Line\//i.test(ua) ? "라인" : /Threads|Barcelona/i.test(ua) ? "스레드" : /musical_ly|Bytedance|TikTok/i.test(ua) ? "틱톡" : /DaumApps|everytimeApp|Twitter/i.test(ua) ? "이 앱" : /; wv\)/.test(ua) ? "이 앱" : "";
    if (test && !app) app = "인스타그램";
    gogoApp = app;
    var hasIsland = false;
    try { for (var i = 0; i < localStorage.length; i++) if ((localStorage.key(i) || "").indexOf("gogo.snap.") === 0) { hasIsland = true; break; } } catch (e) {}
    if (!app || (!isPhone && !test) || /[?&]inapp=0/.test(q) || (hasIsland && !test) || (gogoLS("gogo.inapp.stay") === "1" && !test)) { start(); return; }
    var android = /Android/i.test(ua) || (test && /[?&]android=1/.test(q));
    var url = location.href.replace(/([?&])inapp=1&?/, "$1").replace(/[?&]$/, "");
    // 카톡 · 라인은 바깥 브라우저로 여는 길이 따로 있음 → 바로 시도하고, 안 넘어가면 아래 카드가 보임
    if (!test && app === "카카오톡") { gogoPick = "auto"; location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); }
    if (!test && app === "라인" && !/openExternalBrowser=1/.test(url)) { gogoPick = "auto"; location.href = url + (url.indexOf("?") < 0 ? "?" : "&") + "openExternalBrowser=1"; }
    var box = document.createElement("div");
    box.id = "inapp";
    box.innerHTML =
      '<div class="ia-card">' +
      '<div class="ia-egg">🥚</div>' +
      '<div class="ia-t">' + app + ' 안에서는<br>게임이 멈출 수 있어요</div>' +
      '<div class="ia-b">' + (android ? "크롬" : "사파리") + '으로 열면 훨씬 부드럽게<br>놀 수 있어~티라노!</div>' +
      (android
        ? '<button class="ia-go" id="iaGo">크롬으로 열기</button>'
        : '<div class="ia-step">오른쪽 위 <b>⋯</b> 를 누르고<br><b>외부 브라우저로 열기</b>를 골라 줘</div><button class="ia-go" id="iaCopy">주소 복사하기</button><div class="ia-url" id="iaUrl"></div>') +
      '<button class="ia-stay" id="iaStay">그냥 여기서 할래요</button></div>';
    document.body.appendChild(box);
    var goBtn = document.getElementById("iaGo"), cp = document.getElementById("iaCopy");
    if (goBtn) goBtn.onclick = function () {
      gogoPick = "chrome"; gogoLoadNote({});
      var rest = url.replace(/^https?:\/\//, "");
      location.href = "intent://" + rest + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
    };
    if (cp) cp.onclick = function () {
      gogoPick = "copy"; gogoLoadNote({});
      function said() { cp.textContent = "복사했어! 사파리에 붙여 넣어 줘"; }
      function show() { var u = document.getElementById("iaUrl"); u.textContent = url; u.style.display = "block"; cp.textContent = "아래 주소를 꾹 눌러 복사해 줘"; }
      try { navigator.clipboard.writeText(url).then(said, show); } catch (e) { show(); }
    };
    document.getElementById("iaStay").onclick = function () {
      gogoPick = (gogoPick && gogoPick !== "auto" ? gogoPick + "+" : "") + "stay";
      gogoLS("gogo.inapp.stay", "1");
      box.parentNode.removeChild(box); start();
    };
  }

  var script = document.createElement("script");
  script.src = buildUrl + "/Web.loader.js" + gogoV;
  // 폰은 PC용 텍스처(DXT)를 못 읽어서 풀어서 올림 → 메모리·발열. 폰용 ASTC 데이터가 있으면 그걸 받음 (GOGO → 웹 빌드 (폰 텍스처 포함))
  var astcUrl = config.dataUrl.replace(/\.data/, ".astc.data");
  function phoneAstc() {
    try {
      var c = document.createElement("canvas"), gl = c.getContext("webgl2") || c.getContext("webgl");
      var ok = !!(gl && gl.getExtension("WEBGL_compressed_texture_astc"));
      var lose = gl && gl.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext();
      return ok;
    } catch (e) { return false; }
  }
  // SPLITDATA 11-06: GitHub 은 한 파일 100MB 까지라 폰용 데이터가 크면 .part0 .part1 … 로 나뉘어 올라감 (WebBuildPhone)
  //  → 조각을 다 받아 이어 붙여 풂 (빠른 받기만 가능). 빠른 받기가 안 되는 옛 브라우저는 PC용 데이터를 그대로 받음
  var gogoParts = 0, gogoDxtUrl = config.dataUrl;
  function gogoPartUrl(u, k) { var q = u.indexOf("?"); return q < 0 ? u + ".part" + k : u.slice(0, q) + ".part" + k + u.slice(q); }
  function gogoCanFast() { return !!(window.DecompressionStream && window.ReadableStream && window.Response) && !/[?&]slowload=1/.test(location.search); }
  function gogoCountParts(u, k) {
    return fetch(gogoPartUrl(u, k), { method: "HEAD", cache: "no-store" }).then(function (r) { return r.ok && k < 8 ? gogoCountParts(u, k + 1) : k; }).catch(function () { return k; });
  }
  script.onload = function () {
    if (isPhone && phoneAstc()) {
      fetch(astcUrl, { method: "HEAD", cache: "no-store" }).then(function (r) {
        if (r.ok) { config.dataUrl = astcUrl; return; }
        if (!gogoCanFast()) return;
        return gogoCountParts(astcUrl, 0).then(function (n) { if (n >= 2) { gogoParts = n; config.dataUrl = astcUrl; } });
      }).catch(function () {}).then(boot);
    } else boot();
  };
  // OPTIM-LOAD 11-04 로딩 빠르게: GitHub Pages 는 압축 헤더를 못 붙여서, 예전엔 유니티가 JS 로 brotli 를 풀었음
  // (폰 기준 약 35초). 이제 빌드는 gzip 이고, 브라우저에 들어 있는 압축 풀기(DecompressionStream)로 풂 (폰 기준 약 5초).
  // 안 되는 옛 브라우저는 예전처럼 유니티가 직접 풂. ?slowload=1 이면 예전 방식으로 시험.
  var gogoPre = 0, gogoBlobs = [];
  // 유니티 캐시 청소: 빌드마다 주소(?v=)가 바뀌는데 버전 이름(0.1.0)은 같아서, 옛 데이터(한 번에 약 70MB)가 1GB 찰 때까지 안 지워졌음
  // → 폰 저장 공간이 차서 섬 저장이 실패할 수 있음. 지금 번호가 아닌 것만 지움 (섬 저장(/idbfs)은 다른 곳이라 안 건드림)
  function gogoPurgeCache() {
    try {
      if (!window.caches) return;
      var cur = gogoV.replace("?", "");
      caches.open("UnityCache_" + config.companyName + "_" + config.productName).then(function (c) {
        return c.keys().then(function (ks) {
          var n = 0;
          ks.forEach(function (rq) { if (rq.url.indexOf(cur) < 0) { n++; c.delete(rq); } });
          if (n) console.log("[GOGO] 옛 게임 파일 " + n + "개 지움");
        });
      }).catch(function () {});
    } catch (e) {}
  }
  function gogoFast(next) {
    gogoPurgeCache();
    if (!gogoCanFast()) return next();
    var list = [["codeUrl", "application/wasm"], ["frameworkUrl", "text/javascript"], ["dataUrl", "application/octet-stream"]];
    var guess = [20e6, 1.2e5, 76e6], tot = [0, 0, 0], got = [0, 0, 0];
    function show() { var T = tot[0] + tot[1] + tot[2]; if (T > 0) gogoLoad.progress(0.75 * Math.min(1, (got[0] + got[1] + got[2]) / T)); }
    // 한 파일이면 그대로, 조각(SPLITDATA)이면 조각을 한꺼번에 받기 시작해서 순서대로 이어 읽음
    function gogoOpen(i) {
      var u = config[list[i][0]];
      var urls = i === 2 && gogoParts >= 2 ? Array.apply(null, Array(gogoParts)).map(function (_, k) { return gogoPartUrl(u, k); }) : [u];
      return Promise.all(urls.map(function (pu) { return fetch(pu); })).then(function (rs) {
        var len = 0;
        rs.forEach(function (r) { if (!r.ok || !r.body) throw new Error("http " + r.status); len += +r.headers.get("Content-Length") || 0; });
        var k = 0, cur = rs[0].body.getReader();
        var rd = { read: function () {
          return cur.read().then(function (x) {
            if (!x.done || k >= rs.length - 1) return x;
            k++; cur = rs[k].body.getReader(); return rd.read();
          });
        } };
        return { len: len, rd: rd };
      });
    }
    Promise.all(list.map(function (it, i) {
      return gogoOpen(i).then(function (o) {
        tot[i] = o.len || guess[i];
        var rd = o.rd, first = true;
        var counted = new ReadableStream({
          pull: function (ctl) {
            return rd.read().then(function (x) {
              if (x.done) { ctl.close(); return; }
              if (first) { first = false; if (x.value.length < 2 || x.value[0] !== 0x1f || x.value[1] !== 0x8b) throw new Error("gzip 아님"); }
              got[i] += x.value.length; show(); ctl.enqueue(x.value);
            });
          }

      }).then(function (b) { return URL.createObjectURL(b); });
    })).then(function (urls) {
      urls.forEach(function (u, i) { config[list[i][0]] = u; gogoBlobs.push(u); });
      gogoPre = 0.75; next();
    }).catch(function (e) {
      console.warn("[GOGO] 빠른 받기 실패 → 예전 방식", e); gogoPre = 0;
      if (gogoParts) { gogoParts = 0; config.dataUrl = gogoDxtUrl; }   // SPLITDATA 조각은 예전 방식으로 못 받음 → PC용 데이터
      next();
    });
  }
  function gogoFastFree() { gogoBlobs.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} }); gogoBlobs = []; }
  function boot() { gogoFast(boot2); }
  function boot2() {
    createUnityInstance(canvas, config, function (p) {
      gogoLoad.progress(gogoPre + p * (1 - gogoPre)); gogoLive.st(p < 0.9 ? "load" : "start");   // CRASHMARK
    }).then(function (instance) {
      window.gogoInstance = instance; gogoLive.st("game");   // CRASHMARK
      gogoLS("gogo.loadok", String(+(gogoLS("gogo.loadok") || 0) + 1)); gogoLoadNote({ s: Math.round((Date.now() - gogoT0) / 1000) });   // INAPPOUT 받기 기록
      gogoFastFree();
      gogoLoad.progress(1);
      gogoLoad.done();
    }).catch(function (e) {
      gogoLS("gogo.loadfail", String(+(gogoLS("gogo.loadfail") || 0) + 1)); gogoLoadNote({ err: String(e).slice(0, 60) });   // INAPPOUT
      gogoLoad.fail("게임을 불러오지 못했어요: " + e);
    });
  };
  gogoInApp(function () { document.body.appendChild(script); });   // INAPPOUT 앱 안 브라우저면 먼저 물어봄
</script>
