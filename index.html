<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2a4c">
<title>GOGO</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2a4c; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* 노치·홈바를 피해서 게임 화면을 놓음. 기기마다 다른 안전 영역을 브라우저가 알려 줌 */
  #game { position: fixed; display: block; outline: none;
    left: env(safe-area-inset-left, 0px); top: env(safe-area-inset-top, 0px);
    width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff4d6; font: bold 20px system-ui, sans-serif; gap: 14px; text-align: center; padding: 16px; }
  #bar { width: min(70vw, 360px); height: 14px; border-radius: 7px; background: #ffffff33; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #ffd66b; transition: width .2s; }
</style>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="load"><div id="msg">공룡섬으로 가는 중…</div><div id="bar"><div id="fill"></div></div></div>
<script>
  // 저장 데이터를 브라우저가 임의로 지우지 않게 요청 (폰에서 저장 유지)
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});

  // 이름 입력창(#gogo-ask)이 떠 있을 땐 게임보다 먼저 키를 받아서, 게임이 글자를 가로채지 않게 함
  // (게임보다 먼저 등록해야 해서 로더보다 앞에 둠. 글자 입력 자체는 브라우저 기본 동작이라 그대로 됨)
  ["keydown", "keypress", "keyup", "touchstart", "touchend", "mousedown", "mouseup", "pointerdown", "pointerup"].forEach(function (type) {
    window.addEventListener(type, function (e) {
      var t = e.target;
      if (!t || !t.closest || !t.closest("#gogo-ask")) return;
      e.stopImmediatePropagation();
      if (type !== "keydown") return;
      if (e.key === "Enter") { if (e.isComposing || e.keyCode === 229) { if (window.gogoAskEnterAfterIme) window.gogoAskEnterAfterIme(); } else if (window.gogoAskSubmit) window.gogoAskSubmit(); }
      else if (e.key === "Escape" && window.gogoAskCancel) window.gogoAskCancel();
    }, true);
  });

  var canvas = document.getElementById("game");
  var isPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // 폰: 첫 터치에 전체화면 시도 (세로 기본, 가로도 됨. 안 되는 브라우저는 그냥 넘어감)
  if (isPhone) {
    document.addEventListener("touchend", function once() {
      document.removeEventListener("touchend", once);
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    }, { passive: true });
  }

  var buildUrl = "Build";
  var config = {
    dataUrl: buildUrl + "/Web.data.unityweb",
    frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
    codeUrl: buildUrl + "/Web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "GOGO",
    productVersion: "0.1.0",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: isPhone ? Math.min(window.devicePixelRatio || 1, 1.75) : (window.devicePixelRatio || 1),   // 폰 발열 줄이기
  };

  var script = document.createElement("script");
  script.src = buildUrl + "/Web.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.getElementById("fill").style.width = Math.round(p * 100) + "%";
    }).then(function (instance) {
      window.gogoInstance = instance;
      document.getElementById("load").style.display = "none";
    }).catch(function (e) {
      document.getElementById("msg").textContent = "게임을 불러오지 못했어요: " + e;
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
